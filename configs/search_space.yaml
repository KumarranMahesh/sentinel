# Staged search (PLAN.md Section 11). Objective since v2: micro trigger-based event F1 (ET).
# v2 change: stage2b adds short events (max_len 50) and a long rest period (cooldown 800),
# i.e. the "short alerts + rest period" idea (research/IDEAS.md #4).
# Each stage is a grid over dotted config keys;
# keys not listed keep the best value from earlier stages (or the default).
# Deviations from PLAN v1.0 (logged in LOGBOOK / PLAN Section 20):
#  - theta_enter is searched in every stage because the default 3.0 is far from the best
#    operating point, which would bias the other choices;
#  - stages 2 and 3 are split into coordinate-wise sub-grids (laptop compute: a full
#    324-config stage 2 grid took ~1.5 h);
#  - `relative` keys are offsets from the current best value.
stages:
  - name: stage1_detectors
    grid:
      residual.window: [128, 256, 512]
      shape.m: [16, 32, 64]
      shape.history: [1000, 2000]
      change.k: [0.5, 1.0]
      events.theta_enter: [3.0, 4.0, 5.0]
  - name: stage2a_threshold_smoothing
    grid:
      events.theta_enter: [3.5, 4.0, 4.5, 5.0, 5.5, 6.0]
      events.exit_offset: [0.5, 1.0]
      fusion.smooth: [1, 3, 5]
  - name: stage2b_cooldown_maxlen
    grid:
      events.cooldown: [100, 200, 400, 800]
      events.max_len: [50, 200, 800]
      events.theta_enter: [-0.5, 0.0, 0.5]
    relative: [events.theta_enter]
  - name: stage3a_fusion_calibration
    grid:
      fusion.method: [max_bonferroni, fisher]
      fusion.smooth_mode: [mean, mean_or_peak]
      calibration.learn_in_cooldown: [false, true]
      events.theta_enter: [-0.5, 0.0, 0.5]
    relative: [events.theta_enter]
  - name: stage3b_season_transform
    grid:
      season.acf_min: [0.2, 0.3, 0.5]
      transform.log1p: [false, true]
      events.theta_enter: [-0.5, 0.0, 0.5]
    relative: [events.theta_enter]
  - name: stage3c_capped_cusum
    grid:
      change.cap: [2.0, 3.0, 5.0]
      events.theta_enter: [-0.5, 0.0, 0.5]
    relative: [events.theta_enter]
  - name: stage3d_shape_detector
    grid:
      shape.enabled: [true, false]
      events.theta_enter: [-0.5, 0.0, 0.5]
    relative: [events.theta_enter]
  - name: stage3e_deseasonalized_change
    grid:
      change.deseasonalize: [true]
      events.theta_enter: [-0.5, 0.0, 0.5]
    relative: [events.theta_enter]
