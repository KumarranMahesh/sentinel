# v3 final config (LOGBOOK L-0056). v2 (configs/v2_final.yaml) + D7 subspace (lag 32) + D4 LOF,
# theta_enter 5.0. Chosen by the v3 adoption rule (L-0048) and tie-break (L-0055) among candidate
# families validated with scripts/validate.py (results/validation/summary.csv):
#   in-sample ET 0.541, theta-LOCO 0.482, time-split late 0.571 (v2: 0.479 / 0.479 / 0.527).
probation:
  percent: 0.15
  default_len: 750
season:
  acf_min: 0.3
transform:
  log1p: false
  skew_min: 2.0
residual:
  enabled: true
  window: 256
  ew_mad_rate: 0.02
  season_beta: 0.1
  season_min_count: 3
change:
  enabled: true
  slow_rate: 0.005
  k: 1.0
  k_v: 0.5
  h: 5.0
  rebaseline_scale: false
  deseasonalize: true
shape:
  enabled: false
  m: 16
  history: 1000
lof:
  enabled: true
subspace:
  enabled: true
calibration:
  buffer: 2000
  tail_q: 0.95
  min_exceed: 10
  min_tail_n: 100
  recalc_every: 50
  learn_in_cooldown: true
fusion:
  method: max_bonferroni
  smooth: 5
  smooth_mode: mean
events:
  enabled: true
  theta_enter: 5.0
  exit_offset: 0.5
  cooldown: 400
  max_len: 200
  label_len: 1
  pause: true
  rebaseline: true
  rebaseline_r: 50
  rebaseline_sigma: 3.0
